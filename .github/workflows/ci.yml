name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - &checkout_public_repository
        name: Checkout public repository without Actions token
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${REPOSITORY}.git"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_NUMBER}" ]; then
            git fetch --depth=1 origin "pull/${PR_NUMBER}/merge"
          else
            git fetch --depth=1 origin "$SHA"
          fi
          git checkout --detach FETCH_HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E smoke
        working-directory: web
        env:
          PW_WORKERS: "2"
          VITE_ENABLE_AUTH_GATE: "1"
          VITE_ALLOW_LOCAL_AUTH_GATE: "1"
          VITE_PRIVATE_INSTANCE_AUTH: "0"
        run: npm run test:e2e:smoke

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - *checkout_public_repository

      - name: Setup backend Python
        uses: ./.github/actions/setup-backend-python

      - name: Run backend unit tests
        run: python -m pytest tests/unit -q --ignore=tests/unit/test_agent_answer_runtime_e2e.py

      - name: Run backend sanity tests
        run: python -m pytest tests/sanity -q

  quality_gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - *checkout_public_repository

      - name: Setup backend Python
        uses: ./.github/actions/setup-backend-python

      - name: Check visible Research Agent answer contract
        run: python -m pytest tests/unit/test_agent_answer_runtime_e2e.py -q

      - name: Check research QA regression fixture
        run: python tools/research_qa/run_research_qa_eval.py --dry-run

      - name: Check optional reviewed Research Agent replay fixture
        run: python tools/research_qa/run_reviewed_replay_eval.py

      - name: Check converter quality regression manifest
        run: python tools/converter_quality/run_converter_quality_eval.py --dry-run

  build_and_test:
    name: CI summary
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - quality_gates
    if: ${{ always() }}

    steps:
      - name: Check required job results
        shell: bash
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          QUALITY_GATES_RESULT: ${{ needs.quality_gates.result }}
        run: |
          set -euo pipefail
          echo "frontend=${FRONTEND_RESULT}"
          echo "backend=${BACKEND_RESULT}"
          echo "quality_gates=${QUALITY_GATES_RESULT}"
          test "${FRONTEND_RESULT}" = "success"
          test "${BACKEND_RESULT}" = "success"
          test "${QUALITY_GATES_RESULT}" = "success"
