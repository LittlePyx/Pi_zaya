name: CI

on:
  push:
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public repository without Actions token
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${REPOSITORY}.git"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_NUMBER}" ]; then
            git fetch --depth=1 origin "pull/${PR_NUMBER}/merge"
          else
            git fetch --depth=1 origin "$SHA"
          fi
          git checkout --detach FETCH_HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Run backend unit tests
        run: python -m pytest tests/unit -q

      - name: Check research QA regression fixture
        run: python tools/research_qa/run_research_qa_eval.py --dry-run

      - name: Check converter quality regression manifest
        run: python tools/converter_quality/run_converter_quality_eval.py --dry-run
