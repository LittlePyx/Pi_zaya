name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_test_publish:
    name: Quality gates, portable/installer builds, and release
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version, tag, and distribution license
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $package = Get-Content -LiteralPath web/package.json -Raw | ConvertFrom-Json
          if ([string]$package.version -ne $version) {
            throw "web/package.json version '$($package.version)' does not match VERSION '$version'."
          }
          if (-not (Test-Path -LiteralPath LICENSE)) {
            throw "LICENSE is required before Pi_zaya can be distributed. Choose the license deliberately; the workflow will not infer one."
          }
          $license = Get-Content -LiteralPath LICENSE -Raw
          if ($license -notmatch '^MIT License\s' -or $license -notmatch 'Copyright \(c\) [^\r\n]+ LittlePyx') {
            throw "LICENSE must contain the approved MIT license and LittlePyx copyright line."
          }
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' must exactly match VERSION as 'v$version'."
          }
          $releaseNotes = "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $releaseNotes -PathType Leaf)) {
            throw "Reviewed bilingual release notes are required at '$releaseNotes'."
          }
          "PI_ZAYA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PI_ZAYA_RELEASE_NOTES=$releaseNotes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup backend Python
        uses: ./.github/actions/setup-backend-python
        with:
          requirements-file: requirements-release.txt

      - name: Backend static and unit gates
        shell: pwsh
        run: |
          python -m ruff check . --output-format=github
          python tools/check_architecture_budgets.py
          python -m pytest tests/unit -q
          python -m pytest tests/sanity -q

      - name: Research and conversion quality gates
        shell: pwsh
        run: |
          python tools/retrieval_eval/run_retrieval_eval.py --dry-run --fail-on-quality
          python tools/retrieval_eval/run_research_qa_baseline.py --validate-only
          python tools/retrieval_eval/run_dense_research_qa_benchmark.py --validate-only
          python tools/retrieval_eval/run_research_qa_baseline.py --fixture docs/retrieval_eval_development_v1.json --baseline docs/retrieval_bm25_baseline_development_v1.json --validate-only
          python tools/retrieval_eval/run_cross_encoder_research_qa_benchmark.py --validate-only
          python tools/retrieval_eval/validate_semantic_paraphrase_fixture.py
          python tools/retrieval_eval/validate_semantic_retrieval_report.py
          python tools/retrieval_eval/validate_semantic_representation_report.py
          python tools/retrieval_eval/validate_parent_collapsed_multivector_candidate.py
          python tools/retrieval_eval/run_parent_collapsed_multivector_benchmark.py --validate-only
          python tools/retrieval_eval/validate_e5_large_instruct_candidate.py
          python tools/retrieval_eval/run_e5_large_instruct_benchmark.py --validate-only
          python tools/retrieval_eval/validate_candidate_comparison_protocol.py
          python tools/retrieval_eval/validate_candidate_batch.py
          python tools/retrieval_eval/run_candidate_screening.py --candidate-id granite_embedding_278m_multilingual_v1 --validate-only
          python tools/retrieval_eval/run_candidate_screening.py --candidate-id qwen3_embedding_0_6b_v1 --validate-only
          python tools/retrieval_eval/run_candidate_screening.py --nominate --validate-only
          python tools/retrieval_eval/validate_qwen_fusion_protocol_v2.py
          python tools/retrieval_eval/validate_qwen_fusion_tuning_v2_invalidation.py
          python tools/retrieval_eval/validate_user_journey_expansion_protocol.py
          python tools/retrieval_eval/validate_user_journey_authoring_manifest.py
          python tools/retrieval_eval/build_user_journey_expansion_fixture.py --db-root db --check
          python tools/retrieval_eval/validate_user_journey_expansion_fixture.py
          python tools/retrieval_eval/validate_user_journey_bm25_baseline.py
          python tools/retrieval_eval/build_user_journey_bm25_outcome.py --check
          python tools/retrieval_eval/validate_user_journey_qwen_dense_protocol.py
          python tools/retrieval_eval/run_user_journey_qwen_dense_diagnostic.py --validate-only
          python tools/retrieval_eval/validate_user_journey_fusion_v3_protocol.py
          python tools/retrieval_eval/validate_user_journey_fusion_v3_invalidation.py
          python tools/retrieval_eval/validate_user_journey_fusion_v3_1_protocol.py
          python tools/retrieval_eval/run_user_journey_fusion_v3_selection.py --validate-only
          python tools/retrieval_eval/validate_user_journey_fusion_v3_1_semantic_protocol.py
          python tools/retrieval_eval/validate_user_journey_fusion_v3_1_semantic_invalidation.py
          python tools/retrieval_eval/validate_user_journey_fusion_v3_1_semantic_protocol_v2.py
          python tools/retrieval_eval/run_user_journey_fusion_v3_1_semantic_acceptance.py --validate-only
          python tools/retrieval_eval/validate_product_shadow_protocol.py
          python tools/retrieval_eval/run_product_shadow_operational_replay.py --validate-only
          python tools/retrieval_eval/validate_product_shadow_vectorized_protocol.py
          python tools/retrieval_eval/validate_product_opt_in_contract.py
          python tools/retrieval_eval/validate_cpu_query_compatibility_protocol.py
          python tools/retrieval_eval/run_cpu_query_compatibility.py --validate-only
          python tools/retrieval_eval/validate_cpu_full_index_feasibility_protocol.py
          python tools/retrieval_eval/run_cpu_full_index_feasibility.py --validate-only
          python tools/retrieval_eval/validate_cpu_padding_diagnostic_protocol.py
          python tools/retrieval_eval/analyze_cpu_padding.py --validate-only
          python tools/retrieval_eval/validate_lighter_runtime_screen_protocol.py
          python tools/retrieval_eval/validate_lighter_runtime_stage0.py
          python tools/retrieval_eval/validate_lighter_runtime_stage0_e5_small.py
          python tools/retrieval_eval/validate_e5_small_window_census_protocol.py
          python tools/retrieval_eval/analyze_e5_small_window_census.py --validate-only
          python tools/retrieval_eval/validate_lighter_runtime_stage1_e5_small_protocol.py
          python tools/retrieval_eval/run_lighter_runtime_stage1_e5_small.py --validate-only
          python tools/retrieval_eval/validate_lighter_runtime_stage2_e5_small_protocol.py
          python tools/retrieval_eval/run_lighter_runtime_stage2_e5_small.py --validate-only
          python tools/retrieval_eval/validate_local_semantic_preparation_protocol.py
          python tools/retrieval_eval/validate_product_e5_selector_shadow_protocol.py
          python tools/retrieval_eval/validate_product_e5_selector_shadow_report.py
          python tools/retrieval_eval/validate_product_e5_user_journey_protocol.py
          python tools/retrieval_eval/validate_product_e5_user_journey_report.py
          python tools/retrieval_eval/validate_scoped_fresh_authoring_protocol.py
          python tools/retrieval_eval/validate_scoped_fresh_cases.py
          python tools/retrieval_eval/validate_scoped_fresh_e5_protocol.py
          python tools/retrieval_eval/validate_scoped_fresh_e5_report.py
          python tools/retrieval_eval/validate_portable_optional_e5_protocol.py
          python tools/retrieval_eval/validate_portable_optional_e5_report.py
          python tools/retrieval_eval/validate_portable_e5_product_startup_protocol.py
          python tools/retrieval_eval/validate_portable_e5_product_startup_report.py
          python tools/retrieval_eval/validate_portable_e5_architecture_startup_protocol.py
          python tools/retrieval_eval/validate_portable_e5_architecture_startup_report.py
          python tools/retrieval_eval/validate_local_semantic_component_lifecycle_contract.py
          python tools/retrieval_eval/validate_portable_e5_full_size_lifecycle_protocol.py
          python tools/retrieval_eval/validate_portable_e5_full_size_lifecycle_report.py
          python tools/retrieval_eval/validate_portable_e5_full_size_lifecycle_protocol_v2.py
          python tools/retrieval_eval/validate_portable_e5_full_size_lifecycle_report_v2.py
          python tools/retrieval_eval/validate_portable_e5_full_size_lifecycle_protocol_v3.py
          python tools/retrieval_eval/validate_portable_e5_full_size_lifecycle_report_v3.py
          python tools/retrieval_eval/run_product_e5_runtime_parity.py --validate-only
          python tools/retrieval_eval/validate_lighter_runtime_stress_manifest.py
          python tools/retrieval_eval/validate_lighter_runtime_pointer_invalidation.py
          python tools/retrieval_eval/validate_lighter_runtime_stage1_protocol.py
          python tools/retrieval_eval/run_lighter_runtime_stage1.py --validate-only
          python tools/retrieval_eval/run_product_shadow_vectorized_replay.py --validate-only
          python tools/research_qa/validate_claim_entailment_fixture.py
          python tools/research_qa/validate_claim_nli_candidate.py
          python tools/research_qa/run_claim_nli_benchmark.py --validate-only
          python tools/research_qa/run_claim_verifier_baseline.py --validate-only
          python tools/research_qa/build_claim_shadow_report.py --validate-only
          python tools/research_qa/build_quality_outcome_report.py --validate-only
          python tools/observability/validate_local_observability_contract.py
          python tools/research_qa/run_research_qa_eval.py --dry-run
          python tools/version_ab/run_version_ab_eval.py --dry-run
          python tools/evidence_matrix/run_comparison_eval.py --dry-run
          python tools/evidence_matrix/run_comparison_candidate_eval.py --dry-run
          python tools/evidence_matrix/run_project_status_eval.py --dry-run
          python tools/evidence_matrix/run_project_research_journey_eval.py --dry-run
          python tools/research_qa/run_research_qa_eval.py --replay docs/research_qa_grounded_replay_v1.jsonl --fail-on-quality
          python tools/research_qa/run_reviewed_replay_eval.py
          python tools/converter_quality/run_converter_quality_eval.py --dry-run

      - name: Install, lint, and build frontend
        working-directory: web
        shell: pwsh
        run: |
          npm ci
          npm run lint
          npm run build
          npx playwright install chromium

      - name: Run frontend E2E smoke
        working-directory: web
        shell: pwsh
        run: npm run test:e2e:smoke
        env:
          PW_WORKERS: "2"
          VITE_ENABLE_AUTH_GATE: "1"
          VITE_ALLOW_LOCAL_AUTH_GATE: "1"
          VITE_PRIVATE_INSTANCE_AUTH: "0"
          VITE_ENABLE_EVIDENCE_MATRIX_WORKSPACE: "1"

      - name: Run core citation and library E2E regressions
        working-directory: web
        shell: pwsh
        run: npm run test:e2e:core
        env:
          # Keep all 113 core tests and assertions, but avoid multiplying Vite's cold
          # lazy-route transforms across parallel browsers on the Windows release runner.
          PW_WORKERS: "1"
          VITE_ENABLE_AUTH_GATE: "0"
          VITE_ALLOW_LOCAL_AUTH_GATE: "0"
          VITE_PRIVATE_INSTANCE_AUTH: "0"
          VITE_ENABLE_INTERNAL_DEBUG: "1"
          VITE_ENABLE_INTERNAL_ROUTES: "1"
          VITE_SHOW_USER_QUALITY_DIAGNOSTICS: "0"

      - name: Check ordinary-user surface isolation
        working-directory: web
        shell: pwsh
        run: npm run test:e2e:public-surface
        env:
          PW_WORKERS: "1"
          VITE_ENABLE_INTERNAL_DEBUG: "0"
          VITE_ENABLE_INTERNAL_ROUTES: "0"
          VITE_SHOW_USER_QUALITY_DIAGNOSTICS: "0"
          VITE_SHOW_INTERNAL_SETTINGS: "0"

      - name: Check evidence workspace release isolation
        working-directory: web
        shell: pwsh
        run: npm run test:e2e:evidence-workspace-hidden
        env:
          PW_WORKERS: "1"

      - name: Retain frontend E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pi_zaya-frontend-e2e-failure-${{ github.run_id }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          $toolDir = Join-Path $env:RUNNER_TEMP "inno-setup-7.1.0"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile $download
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "Pinned Inno Setup compiler did not have the expected valid Pyrsys B.V. signature."
          }
          $arguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$toolDir`"")
          $process = Start-Process -FilePath $download -ArgumentList $arguments -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($process.ExitCode)." }
          $compiler = Join-Path $toolDir "ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "ISCC.exe was not installed." }
          "PI_ZAYA_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import optional trusted code-signing certificate
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)
          if (-not $hasCertificate -and -not $hasPassword) {
            "PI_ZAYA_SIGNING_ENABLED=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "No trusted signing certificate is configured; beta artifacts will be explicitly marked unsigned."
            exit 0
          }
          if ($hasCertificate -ne $hasPassword) {
            throw "Both WINDOWS_SIGNING_CERT_BASE64 and WINDOWS_SIGNING_CERT_PASSWORD must be configured together."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "pi-zaya-codesigning.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_CERT_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }
          $certificate = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          if (-not $certificate) { throw "The imported PFX did not contain a certificate with a private key." }
          "PI_ZAYA_SIGNING_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PI_ZAYA_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PI_ZAYA_IMPORTED_CERT_THUMBPRINTS=$((@($imported.Thumbprint) -join ';'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build verified optional local semantic component
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "pi-zaya-local-semantic-component"
          $venv = Join-Path $buildRoot ".venv"
          $artifacts = Join-Path $buildRoot "artifacts"
          $stageZeroReport = Join-Path $buildRoot "stage0.json"
          python -m venv $venv
          $componentPython = Join-Path $venv "Scripts\python.exe"
          & $componentPython -m pip install --disable-pip-version-check --no-compile -r ".\tools\retrieval_eval\lighter_runtime_requirements_v1.txt"
          if ($LASTEXITCODE -ne 0) { throw "Installing the optional component build environment failed." }
          & $componentPython ".\tools\retrieval_eval\prepare_lighter_runtime_candidate.py" `
            --candidate-id multilingual_e5_small_official_onnx_v1 `
            --artifact-root $artifacts `
            --report $stageZeroReport
          if ($LASTEXITCODE -ne 0) { throw "Preparing the pinned E5 component artifact failed." }
          python ".\tools\release\build_local_semantic_component.py" `
            --artifact-source (Join-Path $artifacts "multilingual_e5_small_official_onnx_v1") `
            --site-packages (Join-Path $venv "Lib\site-packages") `
            --output-dir ".\release" `
            --release-tag "v$env:PI_ZAYA_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Building the optional local semantic component failed." }
          $componentManifest = [IO.Path]::GetFullPath(".\release\Pi_zaya-local-semantic-e5-small-v1-windows-x64.manifest.json")
          python ".\tools\release\validate_local_semantic_component_release.py" `
            --archive ".\release\Pi_zaya-local-semantic-e5-small-v1-windows-x64.zip" `
            --manifest $componentManifest
          if ($LASTEXITCODE -ne 0) { throw "Validating the optional local semantic component failed." }
          "PI_ZAYA_LOCAL_SEMANTIC_COMPONENT_MANIFEST=$componentManifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PI_ZAYA_LOCAL_SEMANTIC_COMPONENT_ARCHIVE=$([IO.Path]::GetFullPath('.\release\Pi_zaya-local-semantic-e5-small-v1-windows-x64.zip'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build self-contained Windows x64 ZIP and installer
        shell: pwsh
        run: |
          $signing = @{}
          if ($env:PI_ZAYA_SIGNING_ENABLED -eq "1") {
            $signing.SigningThumbprint = $env:PI_ZAYA_SIGNING_THUMBPRINT
            $signing.RequireSignature = $true
          }
          .\tools\release\build_windows_portable.ps1 `
            -PythonRuntime Embedded `
            -SkipFrontendBuild `
            -KeepStage `
            -LocalSemanticComponentManifestPath $env:PI_ZAYA_LOCAL_SEMANTIC_COMPONENT_MANIFEST `
            -LocalSemanticComponentArchivePath $env:PI_ZAYA_LOCAL_SEMANTIC_COMPONENT_ARCHIVE `
            @signing
          .\tools\release\build_windows_installer.ps1 `
            -StageRoot ".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64" `
            -InnoSetupCompiler $env:PI_ZAYA_ISCC `
            @signing

      - name: Validate promoted local semantic product path
        shell: pwsh
        run: |
          $stageRoot = [IO.Path]::GetFullPath(".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64")
          $stagePython = Join-Path $stageRoot "runtime\python\python.exe"
          $validationRoot = Join-Path $env:RUNNER_TEMP "pi-zaya-semantic-product-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $validationRoot) { throw "Local semantic product validation root already exists." }
          & $stagePython ".\tools\release\validate_local_semantic_product_path.py" `
            --archive ".\release\Pi_zaya-local-semantic-e5-small-v1-windows-x64.zip" `
            --manifest $env:PI_ZAYA_LOCAL_SEMANTIC_COMPONENT_MANIFEST `
            --work-root $validationRoot
          $validationExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $validationRoot) {
            Remove-Item -LiteralPath $validationRoot -Recurse -Force
          }
          if ($validationExitCode -ne 0) { throw "Promoted local semantic product path validation failed." }

      - name: Smoke-test downloaded ZIP on a clean Windows profile
        shell: pwsh
        run: .\tools\release\smoke_windows_portable.ps1 -ArchivePath ".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64.zip" -CleanProfile

      - name: Smoke-test installer, in-place upgrade, and preserved user data
        shell: pwsh
        run: |
          $signature = @{}
          if ($env:PI_ZAYA_SIGNING_ENABLED -eq "1") { $signature.RequireSignature = $true }
          .\tools\release\smoke_windows_installer.ps1 `
            -InstallerPath ".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64-setup.exe" `
            @signature

      - name: Verify artifact checksums and signature declarations
        shell: pwsh
        run: |
          $artifacts = @(
            ".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64.zip",
            ".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64-setup.exe",
            ".\release\Pi_zaya-local-semantic-e5-small-v1-windows-x64.zip"
          )
          foreach ($artifact in $artifacts) {
            $expected = ((Get-Content -LiteralPath "$artifact.sha256" -Raw).Trim() -split '\s+')[0]
            $actual = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Release checksum mismatch for $artifact." }
          }
          $installerManifest = Get-Content -LiteralPath ".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64-setup.manifest.json" -Raw | ConvertFrom-Json
          $expectedSigned = $env:PI_ZAYA_SIGNING_ENABLED -eq "1"
          if ([bool]$installerManifest.signed -ne $expectedSigned) { throw "Installer signing declaration does not match the workflow mode." }

      - name: Retain verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pi_zaya-windows-x64-${{ github.run_id }}
          path: |
            release/*.zip
            release/*.zip.sha256
            release/*-setup.exe
            release/*-setup.exe.sha256
            release/*.manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease for a tag
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "Pi_zaya $tag"
          $assets = @(
            ".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64.zip",
            ".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64.zip.sha256",
            ".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64.manifest.json",
            ".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64-setup.exe",
            ".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64-setup.exe.sha256",
            ".\release\Pi_zaya-v$env:PI_ZAYA_VERSION-windows-x64-setup.manifest.json",
            ".\release\Pi_zaya-local-semantic-e5-small-v1-windows-x64.zip",
            ".\release\Pi_zaya-local-semantic-e5-small-v1-windows-x64.zip.sha256",
            ".\release\Pi_zaya-local-semantic-e5-small-v1-windows-x64.manifest.json"
          )
          gh release create $tag @assets --verify-tag --prerelease --notes-file $env:PI_ZAYA_RELEASE_NOTES --title $title

      - name: Remove imported code-signing certificate
        if: always()
        shell: pwsh
        run: |
          foreach ($thumbprint in @($env:PI_ZAYA_IMPORTED_CERT_THUMBPRINTS -split ';')) {
            if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
            }
          }
