name: Setup backend Python
description: Configure Python and install backend test dependencies.

inputs:
  python-version:
    description: Python version used by backend CI jobs.
    required: false
    default: "3.10.11"
  requirements-file:
    description: Backend requirements file used for pip cache and install.
    required: false
    default: requirements.txt
  ci-requirements-file:
    description: Pinned backend test and static-analysis tools.
    required: false
    default: requirements-ci.txt

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          ${{ inputs.requirements-file }}
          ${{ inputs.ci-requirements-file }}

    - name: Install backend dependencies
      shell: bash
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        CI_REQUIREMENTS_FILE: ${{ inputs.ci-requirements-file }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        pip install -r "${REQUIREMENTS_FILE}"
        pip install -r "${CI_REQUIREMENTS_FILE}"
